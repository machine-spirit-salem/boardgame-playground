<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Hex Playground</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  body { margin: 0; font-family: system-ui, sans-serif; background: #2b2b2b; color: #eee; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
  #bar { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; padding: 8px 12px; background: #1d1d1d; }
  #diceBar, #piecesBar { display: flex; flex-wrap: wrap; gap: 6px 12px; align-items: center; padding: 6px 12px; background: #252525; border-top: 1px solid #333; }
  button { padding: 6px 12px; border: 0; border-radius: 4px; background: #555; color: #fff; cursor: pointer; }
  button:hover { background: #777; }
  button.active { background: #c0392b; }
  button.step { width: 28px; padding: 4px 0; }
  .chip { display: inline-flex; align-items: center; gap: 4px; padding: 2px 8px; border-radius: 4px; color: #111; font-weight: 600; }
  .chip img { height: 18px; width: 18px; }

  #zoomBox { display: inline-flex; align-items: center; gap: 6px; }
  #zoomVal { min-width: 44px; text-align: center; font-weight: 700; }

  /* The whole area under the toolbars is one big canvas: the board on the left, free space on the right. */
  #stage { flex: 1 1 0; min-height: 0; overflow: auto; background: #2b2b2b; }
  #board { display: block; }

  .tile { cursor: default; }
  .tile.outer { cursor: pointer; }
  .tile .flip { transition: transform 0.15s ease-in; transform-box: fill-box; transform-origin: center; }
  .tile .flip.flipping { transform: scaleX(0); }
  .tile polygon { stroke: #222; stroke-width: 1.5; }
  .tile.outer:hover polygon { stroke: #fff; }
  #board.override .tile.corner { cursor: crosshair; }
  #board.override .tile.corner:hover polygon { stroke: #fff; }
  .tile image { pointer-events: none; }

  #brushes { display: none; align-items: center; gap: 6px; padding: 3px 10px; border-radius: 16px; background: #333; }
  body.override #brushes { display: inline-flex; }
  #brushes small { color: #aaa; margin-right: 4px; }
  .brush { width: 30px; height: 30px; border-radius: 6px; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; box-sizing: border-box; border: 3px solid transparent; }
  .brush img { width: 22px; height: 22px; pointer-events: none; }
  .brush.sel { border-color: #fff; }
  .brush.cave { width: auto; padding: 0 8px; background: #222; color: #fff; font-size: 13px; }
  .bsep { width: 1px; height: 26px; background: #555; margin: 0 4px; }
  .brush.restore { width: auto; padding: 0 8px; background: #555; color: #fff; font-size: 13px; }
  #board.override { touch-action: none; }
  #board.override .tile.outer { cursor: crosshair; }

  #diceCount { min-width: 22px; text-align: center; font-weight: 700; }
  #diceTray { display: inline-flex; gap: 6px; align-items: center; min-height: 44px; padding: 0 8px; border-radius: 8px; background: #333; }
  #diceTray small { color: #aaa; }
  #dieTypes button.sel { background: #5a7fc8; border-color: #9bb8f0; color: #fff; }
  .die { display: inline-block; line-height: 0; cursor: grab; touch-action: none; }
  .die-on-board { cursor: grab; touch-action: none; }
  .ghost { position: fixed; z-index: 1000; width: 44px; height: 44px; pointer-events: none; line-height: 0; filter: drop-shadow(0 4px 4px rgba(0,0,0,.6)); }

  #colorDots { display: inline-flex; gap: 6px; align-items: center; }
  .cdot { width: 22px; height: 22px; border-radius: 50%; cursor: pointer; box-sizing: border-box; border: 3px solid #333; outline: 2px solid transparent; }
  .cdot.sel { outline-color: #fff; }
  #pieceTray { display: inline-flex; flex-direction: column; gap: 6px; }
  #piecesBar { flex-direction: column; align-items: flex-start; }
  #piecesBar .line { display: flex; flex-wrap: wrap; gap: 6px 12px; align-items: center; }
  .prow { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .prow > small { width: 54px; color: #aaa; }
  .psep { width: 1px; height: 32px; background: #555; margin: 0 4px; }
  .pgroup { display: inline-flex; gap: 2px; padding: 3px 4px; border-radius: 8px; background: #333; }
  .psw { display: inline-flex; width: 48px; height: 48px; align-items: center; justify-content: center; border-radius: 6px; cursor: grab; touch-action: none; }
  .psw:hover { background: #444; }
  .psw svg { pointer-events: none; }
  .piece { cursor: grab; touch-action: none; }
  .piece.dragging { cursor: grabbing; }

  .card { touch-action: none; }
  .card-grip, .card-face { cursor: grab; }
  .card-x { cursor: pointer; }
  .card-text { width: 100%; height: 100%; padding: 2px 3px; box-sizing: border-box; font: 13px/1.35 ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", "Courier New", monospace; color: #222; outline: none; overflow: hidden; resize: none; white-space: pre-wrap; overflow-wrap: anywhere; cursor: text; }
  .card-text:empty::before { content: attr(data-ph); color: #aaa; }
</style>
</head>
<body>
<div id="bar">
  <button id="resetBtn">Hide all</button>
  <button id="revealBtn">Reveal all</button>
  <button id="newMapBtn">New map</button>
  <button id="overrideBtn">Override: off</button>
  <span id="brushes"><small>Paint tiles (click or drag):</small></span>
  <span id="zoomBox">Hex size
    <button class="step" id="zoomOut">−</button><span id="zoomVal"></span><button class="step" id="zoomIn">+</button>
    <button id="zoomFit">Fit</button>
  </span>
  <span id="saveBox">
    <button id="exportBtn" title="Download everything on the board as a file">Export state</button>
    <button id="importBtn" title="Load a previously exported file">Import state</button>
    <input type="file" id="importFile" accept=".json,application/json" hidden>
  </span>
  <span id="legend"></span>
</div>
<div id="diceBar">
  <strong>Dice</strong>
  <span id="dieTypes"></span>
  <span><button class="step" id="diceMinus">−</button> <span id="diceCount">3</span> <button class="step" id="dicePlus">+</button></span>
  <button id="rollBtn">Roll</button>
  <button id="clearDiceBtn">Clear dice</button>
  <span id="diceTray"></span>
</div>
<div id="piecesBar">
  <div class="line"><strong>Pieces</strong> <span id="colorDots" title="Player color"></span>
    <button id="clearPiecesBtn">Clear pieces</button></div>
  <div class="line"><span id="pieceTray"></span></div>
  <div class="line"><button id="newCardBtn">+ New card</button>
    <button id="clearCardsBtn">Clear cards</button>
    <small style="color:#aaa">drag pieces onto the board · right-click or double-click removes · click card text to edit</small></div>
</div>
<div id="stage"><svg id="board"></svg></div>

const ZONE_COLORS = { center: "#f09a00", outer: "#5c5c5c", special: "#8f0000", corner: "#8a00bd" };
const PCOLORS = [ // civilisation colours + neutral. icon/home = which icon colour reads best on it
  { name: "Red",     fill: "#e53935", line: "#fff", icon: "dark",  home: "light" },
  { name: "Blue",    fill: "#1e88e5", line: "#fff", icon: "dark",  home: "light" },
  { name: "Green",   fill: "#43a047", line: "#fff", icon: "dark",  home: "light" },
  { name: "Yellow",  fill: "#fdd835", line: "#111", icon: "dark",  home: "dark"  },
  { name: "White",   fill: "#f5f5f5", line: "#111", icon: "dark",  home: "dark"  },
  { name: "Black",   fill: "#212121", line: "#fff", icon: "light", home: "light" },
  { name: "Neutral", fill: "#6a6a6a", line: "#fff", icon: "light", home: "light" },
];
const NEUTRAL = 6;            // index of the neutral dark grey in PCOLORS
// which civilisation starts on which home hex ("row,column" of the hex)
const HOME_START = { "-6,-6": 0, "-6,6": 1, "0,12": 2, "6,6": 3, "6,-6": 4, "0,-12": 5 };
const OUTER_PER_TERRAIN = 12; // each terrain appears exactly this many times on the grey tiles (6 x 12 = 72)
const SIZE = 56;              // hex radius in board units (bigger hexes = room for two square tokens)
const ICON_SIZE = 76;         // terrain icon size
const BORDER_WIDTH = 8;       // black outline around the orange region
// Minimum world: the board plus space on its right. The canvas always grows to fill the window.
const VB0 = { x: -660, y: -590, w: 1900, h: 1180 };
const BOARD_W = 1320;         // width of the board itself, used by "Fit"
const CARD_W = 130, CARD_H = 182, CARD_GRIP = 20; // cards are a fixed size
// ------------------------------------------

const NS = "http://www.w3.org/2000/svg";
const svg = document.getElementById("board");
const stage = document.getElementById("stage");

function svgPoint(e) {
  const pt = svg.createSVGPoint();
  pt.x = e.clientX; pt.y = e.clientY;
  return pt.matrixTransform(svg.getScreenCTM().inverse());
}
const pick = arr => arr[Math.floor(Math.random() * arr.length)];
function shuffle(a) {
  for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
  return a;
}

// Soft shadows for dice, pieces and cards
const defs = document.createElementNS(NS, "defs");
defs.innerHTML = `
  ${Object.entries(TERRAINS).map(([k, v]) => `<filter id="cave-${k}" color-interpolation-filters="sRGB">
    <feFlood flood-color="${v.color}"/><feComposite in2="SourceAlpha" operator="in"/>
  </filter>`).join("")}
  <filter id="pshadow" x="-40%" y="-40%" width="180%" height="190%">
    <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000" flood-opacity=".7"/>
  </filter>
  <filter id="pshadowLift" x="-50%" y="-50%" width="200%" height="220%">
    <feDropShadow dx="0" dy="6" stdDeviation="3.5" flood-color="#000" flood-opacity=".6"/>
  </filter>
  <filter id="cardShadow" x="-20%" y="-20%" width="140%" height="150%">
    <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#000" flood-opacity=".55"/>
  </filter>`;
svg.append(defs);

// Board layout: rows r = -6..6, columns u in half-hex steps.
const range = (a, b, step) => { const o = []; for (let v = a; v <= b; v += step) o.push(v); return o; };
const ROWS = {
  [-6]: [-6, -4, -2, 2, 4, 6],
  [-5]: range(-7, 7, 2),
  [-4]: range(-8, 8, 2),
  [-3]: range(-7, 7, 2),
  [-2]: range(-10, 10, 2),
  [-1]: range(-11, 11, 2),
  [0]:  range(-12, 12, 2),
};
for (let r = 1; r <= 6; r++) ROWS[r] = ROWS[-r];

function zoneOf(r, u) {
  const R = Math.abs(r), U = Math.abs(u);
  if ((R === 6 && U === 6) || (R === 0 && U === 12)) return "corner";
  if ((R === 4 && U === 0) || (R === 2 && U === 6)) return "special";
  if (Math.max(R, (U + R) / 2) <= 3) return "center";
  return "outer";
}

const hw = Math.sqrt(3) * SIZE / 2;
const tiles = [];
let overrideMode = false, painting = false, brush = "lake", caveValue = true;

function hexPoints() {
  const pts = [];
  for (let i = 0; i < 6; i++) {
    const a = Math.PI / 180 * (60 * i - 30); // pointy-top
    pts.push((SIZE * Math.cos(a)).toFixed(2) + "," + (SIZE * Math.sin(a)).toFixed(2));
  }
  return pts.join(" ");
}

// Outer hexes show their terrain once revealed. Home hexes show their civilisation colour,
// unless they have been overridden with a terrain. A cave hex is black with the terrain icon drawn in the terrain colour.
function setFace(t) {
  const showTerrain = t.zone === "outer" ? t.revealed : (t.zone === "corner" && t.assigned);
  if (showTerrain) {
    const col = TERRAINS[t.assigned.terrain].color;
    t.poly.setAttribute("fill", t.cave ? CAVE_COLOR : col);
    t.img.setAttribute("href", t.assigned.icon);
    if (t.cave) t.img.setAttribute("filter", `url(#cave-${t.assigned.terrain})`); else t.img.removeAttribute("filter");
    t.img.style.display = "";
  } else if (t.zone === "corner") {
    const c = PCOLORS[t.homeColor];
    t.poly.setAttribute("fill", c.fill);
    t.img.removeAttribute("filter");
    t.img.setAttribute("href", (c.home === "dark" ? ICONS.homeDark : ICONS.home)[0]);
    t.img.style.display = "";
  } else {
    t.poly.setAttribute("fill", ZONE_COLORS[t.zone]);
    t.img.removeAttribute("filter");
    t.img.style.display = "none";
  }
}

function flipTo(t, revealed) {
  if (t.zone !== "outer") return; // only grey tiles flip; home, orange and red stay fixed for now
  t.revealed = revealed;
  t.flip.classList.add("flipping");
  setTimeout(() => { setFace(t); t.flip.classList.remove("flipping"); updateLegend(); }, 150);
}

for (const r of Object.keys(ROWS).map(Number)) {
  for (const u of ROWS[r]) {
    const zone = zoneOf(r, u);
    const g = document.createElementNS(NS, "g");
    g.setAttribute("class", "tile " + (zone === "outer" ? "outer" : zone === "corner" ? "corner" : "home"));
    g.setAttribute("transform", `translate(${u * hw},${r * 1.5 * SIZE})`);
    const flip = document.createElementNS(NS, "g");
    flip.setAttribute("class", "flip");
    const poly = document.createElementNS(NS, "polygon");
    poly.setAttribute("points", hexPoints());
    const img = document.createElementNS(NS, "image");
    img.setAttribute("x", -ICON_SIZE / 2); img.setAttribute("y", -ICON_SIZE / 2);
    img.setAttribute("width", ICON_SIZE); img.setAttribute("height", ICON_SIZE);
    flip.append(poly, img);
    g.append(flip);
    svg.append(g);
    const t = { key: r + "," + u, zone, assigned: null, revealed: false, poly, img, flip, cx: u * hw, cy: r * 1.5 * SIZE };
    if (zone === "corner") t.homeColor = t.origHome = HOME_START[r + "," + u];
    setFace(t);
    g.__tile = t;
    g.addEventListener("click", () => { if (!overrideMode) flipTo(t, !t.revealed); });
    g.addEventListener("pointerdown", e => {
      if (!overrideMode || (t.zone !== "outer" && t.zone !== "corner") || e.button !== 0) return;
      e.preventDefault();
      painting = true;
      if (brush === "cave") caveValue = !t.cave; // first hex decides: switch caves on or off for the whole drag
      paint(t);
    });
    tiles.push(t);
  }
}

// Thick black outline around the whole orange (center) region: draw every edge
// of an orange tile whose neighbour is not orange.
(function drawCenterBorder() {
  const center = new Set();
  for (const r of Object.keys(ROWS).map(Number))
    for (const u of ROWS[r]) if (zoneOf(r, u) === "center") center.add(r + "," + u);
  const corner = i => {
    const a = Math.PI / 180 * (60 * i - 30);
    return [SIZE * Math.cos(a), SIZE * Math.sin(a)];
  };
  // neighbour offset (dr, du) -> the two hex corners forming the shared edge
  const EDGES = [[0, 2, 0, 1], [1, 1, 1, 2], [1, -1, 2, 3], [0, -2, 3, 4], [-1, -1, 4, 5], [-1, 1, 5, 0]];
  let d = "";
  center.forEach(key => {
    const [r, u] = key.split(",").map(Number);
    const cx = u * hw, cy = r * 1.5 * SIZE;
    EDGES.forEach(([dr, du, c1, c2]) => {
      if (center.has((r + dr) + "," + (u + du))) return;
      const [x1, y1] = corner(c1), [x2, y2] = corner(c2);
      d += `M${(cx + x1).toFixed(2)},${(cy + y1).toFixed(2)}L${(cx + x2).toFixed(2)},${(cy + y2).toFixed(2)}`;
    });
  });
  const path = document.createElementNS(NS, "path");
  path.setAttribute("d", d);
  path.setAttribute("fill", "none");
  path.setAttribute("stroke", "#000");
  path.setAttribute("stroke-width", BORDER_WIDTH);
  path.setAttribute("stroke-linecap", "round");
  path.setAttribute("stroke-linejoin", "round");
  path.style.pointerEvents = "none";
  svg.append(path);
})();

// Layer order from here on: cards (bottom) < dice < pieces (top)
const cardLayer = document.createElementNS(NS, "g");
svg.append(cardLayer);

// Build a new hidden map: grey tiles get a shuffled fixed supply of each terrain.
function generateMap() {
  const names = Object.keys(TERRAINS);
  const outer = tiles.filter(t => t.zone === "outer");
  const deck = [];
  names.forEach(k => { for (let i = 0; i < OUTER_PER_TERRAIN; i++) deck.push(k); });
  while (deck.length < outer.length) deck.push(pick(names)); // only if the layout ever grows
  shuffle(deck);
  outer.forEach((t, i) => { t.assigned = t.original = { terrain: deck[i], icon: pick(ICONS[deck[i]]) }; t.cave = false; });
  tiles.forEach(t => {
    if (t.zone === "outer" && t.revealed) flipTo(t, false);
    if (t.zone === "corner") { t.assigned = null; t.cave = false; setFace(t); } // home hexes keep their civilisation colour
  });
  updateLegend();
}

function updateLegend() {
  const counts = {}, outerCounts = {};
  Object.keys(TERRAINS).forEach(k => { counts[k] = 0; outerCounts[k] = 0; });
  tiles.forEach(t => {
    if (!t.revealed) return;
    counts[t.assigned.terrain]++;
    if (t.zone === "outer") outerCounts[t.assigned.terrain]++;
  });
  document.getElementById("legend").innerHTML = Object.keys(TERRAINS).map(k =>
    `<span class="chip" style="background:${TERRAINS[k].color}"><img src="${ICONS[k][0]}" alt="">${k}: ${counts[k]} <small style="${outerCounts[k] > OUTER_PER_TERRAIN ? 'color:#b00020;font-weight:800' : ''}">(grey ${outerCounts[k]}/${OUTER_PER_TERRAIN})</small></span>`
  ).join(" ");
}

const playable = () => tiles.filter(t => t.zone === "outer");
document.getElementById("resetBtn").onclick  = () => playable().forEach(t => t.revealed && flipTo(t, false));
document.getElementById("revealBtn").onclick = () => playable().forEach(t => !t.revealed && flipTo(t, true));
document.getElementById("newMapBtn").onclick = generateMap;
generateMap();

// ---------- Override (paint terrain onto grey tiles) ----------
function paint(t) {
  if (t.zone === "outer") {
    let next;
    if (brush === "restore") {
      if (t.assigned === t.original && !t.cave) return;
      next = t.original;
      t.cave = false;
    } else if (brush === "cave") {
      if (t.cave === caveValue && t.revealed) return;
      t.cave = caveValue;
      next = t.assigned;
    } else if (TERRAINS[brush]) {
      if (t.revealed && t.assigned.terrain === brush) return; // (a cave stays a cave when repainted)
      next = (t.assigned && t.assigned.terrain === brush) ? t.assigned : { terrain: brush, icon: pick(ICONS[brush]) };
    } else return; // a home colour brush does nothing on grey tiles
    t.assigned = next;
    flipTo(t, true);
  } else if (t.zone === "corner") {
    if (brush === "restore") { t.assigned = null; t.cave = false; t.homeColor = t.origHome; }
    else if (brush.startsWith("home:")) { t.assigned = null; t.cave = false; t.homeColor = Number(brush.slice(5)); }
    else if (brush === "cave") {
      if (!t.assigned || t.cave === caveValue) return; // only a hex that has a terrain can be a cave
      t.cave = caveValue;
    } else if (TERRAINS[brush]) {
      if (t.assigned && t.assigned.terrain === brush) return;
      t.assigned = { terrain: brush, icon: pick(ICONS[brush]) }; // home hex overridden with a terrain
    } else return;
    setFace(t);
  }
}

const brushBox = document.getElementById("brushes");
const brushEls = {};
Object.keys(TERRAINS).forEach(k => {
  const b = document.createElement("span");
  b.className = "brush"; b.title = k;
  b.style.background = TERRAINS[k].color;
  b.innerHTML = `<img src="${ICONS[k][0]}" alt="${k}">`;
  b.onclick = () => selectBrush(k);
  brushBox.append(b); brushEls[k] = b;
});
const caveEl = document.createElement("span");
caveEl.className = "brush cave"; caveEl.textContent = "Cave";
caveEl.title = "Mark a hex as a cave: black hex with the terrain icon in its colour. Click or drag; the first hex decides whether the drag switches caves on or off.";
caveEl.onclick = () => selectBrush("cave");
brushBox.append(caveEl); brushEls.cave = caveEl;
const sep = document.createElement("span");
sep.className = "bsep";
brushBox.append(sep);
PCOLORS.forEach((c, i) => { // home hex colour brushes
  const b = document.createElement("span");
  b.className = "brush"; b.title = "Home hex: " + c.name;
  b.style.background = c.fill;
  b.innerHTML = `<img src="${(c.home === "dark" ? ICONS.homeDark : ICONS.home)[0]}" alt="">`;
  b.onclick = () => selectBrush("home:" + i);
  brushBox.append(b); brushEls["home:" + i] = b;
});
const restoreEl = document.createElement("span");
restoreEl.className = "brush restore"; restoreEl.textContent = "↺ Original";
restoreEl.title = "Put the originally generated terrain / home colour back";
restoreEl.onclick = () => selectBrush("restore");
brushBox.append(restoreEl); brushEls.restore = restoreEl;

function selectBrush(k) {
  brush = k;
  Object.entries(brushEls).forEach(([n, el]) => el.classList.toggle("sel", n === k));
}
selectBrush("lake");

document.getElementById("overrideBtn").onclick = function () {
  overrideMode = !overrideMode;
  this.textContent = "Override: " + (overrideMode ? "on" : "off");
  this.classList.toggle("active", overrideMode);
  document.body.classList.toggle("override", overrideMode);
  svg.classList.toggle("override", overrideMode);
};

window.addEventListener("pointermove", e => { // drag across tiles to paint several
  if (!painting) return;
  const el = document.elementFromPoint(e.clientX, e.clientY);
  const g = el && el.closest && el.closest(".tile");
  if (g && g.__tile) paint(g.__tile);
});
window.addEventListener("pointerup", () => { painting = false; });
window.addEventListener("pointercancel", () => { painting = false; });

// ---------- Cards ----------
const BARS = "#bar, #diceBar, #piecesBar";
let cardDrag = null;

function placeCard(g, x, y) {
  g.__x = x; g.__y = y;
  g.setAttribute("transform", `translate(${x},${y})`);
}

function makeCard(x, y) {
  const g = document.createElementNS(NS, "g");
  g.setAttribute("class", "card");
  g.setAttribute("filter", "url(#cardShadow)");
  const R = 9;
  g.innerHTML = `
    <rect class="card-face" width="${CARD_W}" height="${CARD_H}" rx="${R}" fill="#fdfdfb" stroke="#333" stroke-width="2"/>
    <path class="card-grip" fill="#dcdcd6" d="M1,${CARD_GRIP} V${R} a${R - 1},${R - 1} 0 0 1 ${R - 1},-${R - 1} H${CARD_W - R} a${R - 1},${R - 1} 0 0 1 ${R - 1},${R - 1} V${CARD_GRIP} Z"/>
    <g class="card-grip" fill="#9a9a94">
      <circle cx="${CARD_W / 2 - 8}" cy="${CARD_GRIP / 2}" r="1.8"/><circle cx="${CARD_W / 2}" cy="${CARD_GRIP / 2}" r="1.8"/><circle cx="${CARD_W / 2 + 8}" cy="${CARD_GRIP / 2}" r="1.8"/>
    </g>
    <g class="card-x">
      <circle cx="${CARD_W - 11}" cy="${CARD_GRIP / 2}" r="6" fill="#c9c9c2"/>
      <path d="M${CARD_W - 13.5},${CARD_GRIP / 2 - 2.5} l5,5 m0,-5 l-5,5" stroke="#555" stroke-width="1.6" stroke-linecap="round"/>
    </g>`;

  // plain editable text
  const fo = document.createElementNS(NS, "foreignObject");
  fo.setAttribute("x", 8); fo.setAttribute("y", CARD_GRIP + 6);
  fo.setAttribute("width", CARD_W - 16); fo.setAttribute("height", CARD_H - CARD_GRIP - 14);
  const txt = document.createElement("div");
  txt.className = "card-text";
  txt.contentEditable = "true";
  txt.spellcheck = false;
  txt.dataset.ph = "Type here…";
  txt.addEventListener("pointerdown", e => e.stopPropagation());   // clicking the text edits, never drags
  txt.addEventListener("contextmenu", e => e.stopPropagation());   // normal copy/paste menu inside the text
  txt.addEventListener("paste", e => {                              // keep it plain text
    e.preventDefault();
    const t = (e.clipboardData || window.clipboardData).getData("text/plain");
    document.execCommand("insertText", false, t);
  });
  txt.addEventListener("input", () => { if (!txt.textContent.trim() && !txt.textContent.includes("\n")) txt.innerHTML = ""; });
  fo.append(txt);
  g.append(fo);

  placeCard(g, x, y);
  cardLayer.append(g);

  g.addEventListener("pointerdown", e => {
    if (e.button !== 0 || e.target.closest(".card-x")) return;
    e.preventDefault();
    if (document.activeElement && document.activeElement.blur) document.activeElement.blur();
    const p = svgPoint(e);
    cardDrag = { g, dx: p.x - g.__x, dy: p.y - g.__y, ox: g.__x, oy: g.__y };
    cardLayer.append(g); // bring to front among the cards
  });
  g.querySelector(".card-x").addEventListener("pointerdown", e => e.stopPropagation());
  g.querySelector(".card-x").addEventListener("click", () => { if (confirm("Delete this card?")) g.remove(); });
  g.addEventListener("contextmenu", e => { e.preventDefault(); g.remove(); });
  return g;
}

document.getElementById("newCardBtn").onclick = () => {
  const n = cardLayer.children.length;
  // park new cards in the free space to the right of the board: columns of four, top to bottom
  const visibleRight = VB0.x + svg.viewBox.baseVal.width;
  const cols = Math.max(1, Math.floor((visibleRight - 700) / (CARD_W + 16)));
  const col = Math.floor(n / 4) % cols, row = n % 4, wrap = Math.floor(n / (4 * cols));
  const g = makeCard(700 + col * (CARD_W + 16) + wrap * 12, -560 + row * (CARD_H + 14) + wrap * 12);
  g.querySelector(".card-text").focus();
};
document.getElementById("clearCardsBtn").onclick = () => { if (cardLayer.children.length && confirm("Delete all " + cardLayer.children.length + " cards?")) cardLayer.replaceChildren(); };

window.addEventListener("pointermove", e => {
  if (!cardDrag) return;
  const p = svgPoint(e);
  placeCard(cardDrag.g, p.x - cardDrag.dx, p.y - cardDrag.dy);
});
function endCardDrag(e) {
  if (!cardDrag) return;
  const { g, ox, oy } = cardDrag;
  cardDrag = null;
  const over = document.elementFromPoint(e.clientX, e.clientY);
  if (over && over.closest(BARS)) placeCard(g, ox, oy); // dropped on a toolbar: snap back
}
window.addEventListener("pointerup", endCardDrag);
window.addEventListener("pointercancel", endCardDrag);

// ---------- Dice ----------
// Dice live either in the tray or freely on the board/background, any number per hex.
const PIPS = {
  1: [[50, 50]],
  2: [[28, 28], [72, 72]],
  3: [[28, 28], [50, 50], [72, 72]],
  4: [[28, 28], [72, 28], [28, 72], [72, 72]],
  5: [[28, 28], [72, 28], [50, 50], [28, 72], [72, 72]],
  6: [[28, 25], [28, 50], [28, 75], [72, 25], [72, 50], [72, 75]],
};
const RES_FACES = ["arcane", "oil", "wood", "stone", "food", "worker"];
const DIE_TYPES = {
  d6:   { label: "d6",         faces: 6 },
  d3:   { label: "d3",         faces: 3 },
  res:  { label: "Resource",   faces: 6 },
  prod: { label: "Production", faces: 3 },
};
const dieImg = (type, x, y, w) => `<image href="${PIECE_ICONS[type].dark}" x="${x}" y="${y}" width="${w}" height="${w}"/>`;
function dieMarkup(d) {
  const t = d.type || "d6", v = d.value;
  const fill = t === "d3" ? "#cfe3ff" : t === "res" ? "#f3e6c8" : t === "prod" ? "#d9f0d0" : "#fafafa";
  let out = `<rect x="5" y="5" width="90" height="90" rx="16" fill="${fill}" stroke="#111" stroke-width="6"/>`;
  if (t === "d6" || t === "d3") out += PIPS[v].map(([x, y]) => `<circle cx="${x}" cy="${y}" r="9" fill="#111"/>`).join("");
  else if (t === "res") out += dieImg(RES_FACES[v - 1], 17, 17, 66);
  else if (v < 3) out += dieImg("gem", 17, 17, 66);   // faces 1 and 2: one resource
  else out += dieImg("gemfire", 12, 12, 76);          // face 3: one resource with flame
  return out;
}
const dieSvg = d => `<svg viewBox="0 0 100 100" width="44" height="44">${dieMarkup(d)}</svg>`;
const rollFace = t => 1 + Math.floor(Math.random() * DIE_TYPES[t].faces);
const FREE_DIE = 36; // die size on the board, in board units
let dice = [], nextDieId = 1, diceCount = 3, dieType = "d6", rolling = false, dieDrag = null;
const diceLayer = document.createElementNS(NS, "g");
svg.append(diceLayer);
const diceTray = document.getElementById("diceTray");

function renderDice() {
  diceTray.innerHTML = "";
  diceLayer.replaceChildren();
  let inTray = 0;
  dice.forEach(d => {
    if (d.dragging) return;
    if (!d.free) {
      inTray++;
      const el = document.createElement("span");
      el.className = "die";
      el.innerHTML = dieSvg(d);
      el.addEventListener("pointerdown", e => beginDieDrag(d, e));
      el.addEventListener("contextmenu", e => { e.preventDefault(); removeDie(d); });
      diceTray.append(el);
    } else {
      const wrap = document.createElementNS(NS, "g"); // outer group carries the shadow
      wrap.setAttribute("filter", "url(#pshadow)");
      const g = document.createElementNS(NS, "g");
      g.setAttribute("class", "die-on-board");
      g.setAttribute("transform", `translate(${d.free.x - FREE_DIE / 2},${d.free.y - FREE_DIE / 2}) scale(${FREE_DIE / 100})`);
      g.innerHTML = dieMarkup(d);
      g.addEventListener("pointerdown", e => beginDieDrag(d, e));
      g.addEventListener("contextmenu", e => { e.preventDefault(); removeDie(d); });
      wrap.append(g);
      diceLayer.append(wrap);
    }
  });
  if (!inTray) diceTray.innerHTML = `<small>${dice.length ? "all dice placed" : "pick a die and press Roll"}</small>`;
}

function removeDie(d) { dice = dice.filter(x => x !== d); renderDice(); }

function rollDice() {
  if (rolling) return;
  // new dice are added to the ones already on the table; Clear dice (or right-click) removes them
  const fresh = Array.from({ length: diceCount }, () => ({ id: nextDieId++, type: dieType, value: rollFace(dieType), free: null }));
  dice = dice.concat(fresh);
  rolling = true;
  renderDice();
  const trayEls = [...diceTray.querySelectorAll(".die")];
  const visible = dice.filter(d => !d.free && !d.dragging);
  const anim = fresh.map(d => trayEls[visible.indexOf(d)]).filter(Boolean);
  let ticks = 0;
  const iv = setInterval(() => { // quick shuffle animation, results are already decided
    fresh.forEach((d, i) => { if (anim[i]) anim[i].firstChild.innerHTML = dieMarkup({ type: d.type, value: rollFace(d.type) }); });
    if (++ticks >= 8) { clearInterval(iv); rolling = false; renderDice(); }
  }, 70);
}

function beginDieDrag(d, e) {
  if (rolling || e.button !== 0) return;
  e.preventDefault();
  const ghost = document.createElement("div");
  ghost.className = "ghost";
  ghost.innerHTML = dieSvg(d);
  document.body.append(ghost);
  d.dragging = true;
  dieDrag = { d, origin: d.free, ghost };
  moveGhost(e);
  renderDice();
}
function moveGhost(e) {
  dieDrag.ghost.style.left = (e.clientX - 22) + "px";
  dieDrag.ghost.style.top = (e.clientY - 22) + "px";
}
window.addEventListener("pointermove", e => { if (dieDrag) moveGhost(e); });

function endDieDrag(e) {
  if (!dieDrag) return;
  const { d, origin, ghost } = dieDrag;
  ghost.remove();
  dieDrag = null;
  d.dragging = false;
  const over = document.elementFromPoint(e.clientX, e.clientY);
  const r = stage.getBoundingClientRect();
  const inStage = e.clientX >= r.left && e.clientX <= r.right && e.clientY >= r.top && e.clientY <= r.bottom;
  d.free = null;
  if (over && over.closest("#diceBar")) {
    // dropped on the dice bar = back to the tray
  } else if (!inStage) {
    d.free = origin; // dropped on another toolbar or off the page: back where it was
  } else {
    const p = svgPoint(e);
    d.free = { x: p.x, y: p.y }; // stays exactly where it was dropped
    dice = dice.filter(x => x !== d).concat(d); // bring to front
  }
  renderDice();
}
window.addEventListener("pointerup", endDieDrag);
window.addEventListener("pointercancel", endDieDrag);

const dieTypesEl = document.getElementById("dieTypes");
Object.entries(DIE_TYPES).forEach(([k, v]) => {
  const b = document.createElement("button");
  b.textContent = v.label; b.dataset.type = k;
  b.title = v.faces + " faces";
  b.onclick = () => { dieType = k; [...dieTypesEl.children].forEach(x => x.classList.toggle("sel", x === b)); };
  if (k === dieType) b.classList.add("sel");
  dieTypesEl.append(b);
});
const setCount = n => { diceCount = Math.max(1, Math.min(12, n)); document.getElementById("diceCount").textContent = diceCount; };
document.getElementById("diceMinus").onclick = () => setCount(diceCount - 1);
document.getElementById("dicePlus").onclick = () => setCount(diceCount + 1);
document.getElementById("rollBtn").onclick = rollDice;
document.getElementById("clearDiceBtn").onclick = () => { if (!rolling) { dice = []; renderDice(); } };
renderDice();

// ---------- Pieces ----------
// Circle tokens = workers and resources, squares = player buildings,
// octagons = neutral enemies, pentagons = neutral buildings (those two kinds are always neutral grey).
const PIECE_GROUPS = [
  { neutral: false, items: [ // plain shapes
    { id: "circle", label: "Circle" }, { id: "square", label: "Square" },
    { id: "triangle", label: "Triangle" }, { id: "octagon", label: "Octagon" } ] },
  { neutral: false, items: [ // circle tokens
    { id: "worker", label: "Worker" }, { id: "arcane", label: "Arcane dust" }, { id: "wood", label: "Wood" },
    { id: "stone", label: "Stone" }, { id: "food", label: "Food" }, { id: "oil", label: "Oil" } ] },
  { neutral: false, items: [ // square tokens
    { id: "windmill", label: "Windmill" }, { id: "mine", label: "Mine" }, { id: "sawmill", label: "Sawmill" },
    { id: "village", label: "Village" }, { id: "tower", label: "Tower" }, { id: "rig", label: "Oil rig" } ] },
  { neutral: true, items: [ // all neutral tokens on one line: enemies on octagons, then buildings on pentagons
    { id: "monster", label: "Monster" }, { id: "camp", label: "Camp" }, { sep: true },
    { id: "rare", label: "Rare resource" }, { id: "monument", label: "Monument" }, { id: "settlement", label: "Settlement" },
    { id: "market", label: "Market" }, { id: "slot", label: "Free construction slot" }, { id: "gate", label: "Gate" } ] },
];
const DISC_PIECES = new Set(["worker", "arcane", "wood", "stone", "food", "oil"]);
const ENEMY_PIECES = new Set(["monster", "camp"]);
const PENT_PIECES = new Set(["rare", "monument", "settlement", "market", "slot", "gate"]);
const ngon = (n, R, rot) => Array.from({ length: n }, (_, i) => {
  const a = Math.PI / 180 * (rot + 360 / n * i);
  return (R * Math.cos(a)).toFixed(1) + "," + (R * Math.sin(a)).toFixed(1);
}).join(" ");
const OCT = ngon(8, 14, 22.5);       // the plain octagon shape
const OCT_BIG = ngon(8, 24, 22.5);   // octagon token for neutral enemies
const PENT = ngon(5, 22, -90);

// Icon image for a piece. The gate has no image yet, so it gets a simple arch drawing instead.
function pieceIcon(type, c, size, dy = 0) {
  const src = PIECE_ICONS[type] && PIECE_ICONS[type][c.icon];
  if (src) return `<image href="${src}" x="${-size / 2}" y="${dy - size / 2}" width="${size}" height="${size}" style="pointer-events:none"/>`;
  const col = c.icon === "dark" ? "#111" : "#fff";
  return `<g transform="translate(0,${dy}) scale(${size / 26})" fill="none" stroke="${col}" stroke-width="2.4" stroke-linejoin="round" style="pointer-events:none">` +
         `<path d="M-10,11 V-1 A10,10 0 0 1 10,-1 V11 Z"/><path d="M-4,11 V3 A4,4 0 0 1 4,3 V11"/></g>`;
}

function pieceMarkup(type, c) { // centred on (0,0); fits a 56 x 56 box
  const st = `fill="${c.fill}" stroke="${c.line}" stroke-width="2.5" stroke-linejoin="round"`;
  if (DISC_PIECES.has(type)) return `<circle r="16.5" ${st}/>` + pieceIcon(type, c, 28);
  if (ENEMY_PIECES.has(type)) return `<polygon points="${OCT_BIG}" ${st}/>` + pieceIcon(type, c, 30);
  if (PENT_PIECES.has(type)) return `<polygon points="${PENT}" ${st}/>` + pieceIcon(type, c, 26, 1);
  switch (type) {
    case "circle":   return `<circle r="12.5" ${st}/>`;
    case "square":   return `<rect x="-11.5" y="-11.5" width="23" height="23" rx="2.5" ${st}/>`;
    case "triangle": return `<polygon points="0,-17 15,9 -15,9" ${st}/>`;
    case "octagon":  return `<polygon points="${OCT}" ${st}/>`;
    default:         return `<rect x="-18" y="-18" width="36" height="36" rx="7" ${st}/>` + pieceIcon(type, c, 30);
  }
}

const pieceLayer = document.createElementNS(NS, "g");
svg.append(pieceLayer); // above the dice
let pieceColor = 0, pieceDrag = null;

function placePiece(g, x, y) {
  g.__x = x; g.__y = y;
  g.setAttribute("transform", `translate(${x},${y})`);
}
function makePiece(type, ci, x, y) {
  const wrap = document.createElementNS(NS, "g"); // outer group carries the shadow, inner group the position
  wrap.setAttribute("filter", "url(#pshadow)");
  const g = document.createElementNS(NS, "g");
  g.setAttribute("class", "piece");
  g.innerHTML = pieceMarkup(type, PCOLORS[ci]);
  placePiece(g, x, y);
  wrap.append(g);
  pieceLayer.append(wrap);
  g.__wrap = wrap; g.__type = type; g.__ci = ci;
  g.addEventListener("pointerdown", e => {
    if (e.button !== 0) return; // right click is handled by contextmenu below
    e.preventDefault();
    const p = svgPoint(e);
    startPieceDrag(g, p.x - g.__x, p.y - g.__y);
  });
  g.addEventListener("contextmenu", e => { e.preventDefault(); wrap.remove(); }); // right click = remove
  g.addEventListener("dblclick", () => wrap.remove());
  return g;
}
function startPieceDrag(g, dx, dy) {
  pieceDrag = { g, dx, dy };
  g.classList.add("dragging");
  g.__wrap.setAttribute("filter", "url(#pshadowLift)"); // lifted shadow while carried
  pieceLayer.append(g.__wrap); // bring to front
}

function renderPieceTray() {
  const tray = document.getElementById("pieceTray");
  tray.innerHTML = "";
  const rows = [document.createElement("div"), document.createElement("div")];
  rows.forEach(r => r.className = "prow");
  rows[0].innerHTML = "<small>Player</small>";
  rows[1].innerHTML = "<small>Neutral</small>";
  PIECE_GROUPS.forEach(grp => {
    const ci = grp.neutral ? NEUTRAL : pieceColor;
    const box = document.createElement("span");
    box.className = "pgroup";
    grp.items.forEach(pt => {
      if (pt.sep) { const s = document.createElement("span"); s.className = "psep"; box.append(s); return; }
      const sw = document.createElement("span");
      sw.className = "psw"; sw.title = pt.label;
      sw.innerHTML = `<svg viewBox="-28 -28 56 56" width="44" height="44">${pieceMarkup(pt.id, PCOLORS[ci])}</svg>`;
      sw.addEventListener("pointerdown", e => {
        if (e.button !== 0) return;
        e.preventDefault();
        const p = svgPoint(e);
        startPieceDrag(makePiece(pt.id, ci, p.x, p.y), 0, 0);
      });
      box.append(sw);
    });
    rows[grp.neutral ? 1 : 0].append(box);
  });
  rows.forEach(r => tray.append(r));
}
const dots = document.getElementById("colorDots");
PCOLORS.forEach((c, i) => {
  const d = document.createElement("span");
  d.className = "cdot" + (i === pieceColor ? " sel" : "");
  d.style.background = c.fill;
  d.title = c.name + (i === NEUTRAL ? " (neutral groups always use it)" : "");
  d.onclick = () => {
    pieceColor = i;
    [...dots.children].forEach((el, j) => el.classList.toggle("sel", j === i));
    renderPieceTray();
  };
  dots.append(d);
});
renderPieceTray();

window.addEventListener("pointermove", e => {
  if (!pieceDrag) return;
  const p = svgPoint(e);
  placePiece(pieceDrag.g, p.x - pieceDrag.dx, p.y - pieceDrag.dy);
});
function endPieceDrag(e) {
  if (!pieceDrag) return;
  const { g } = pieceDrag;
  pieceDrag = null;
  const over = document.elementFromPoint(e.clientX, e.clientY);
  if (over && over.closest(BARS)) g.__wrap.remove(); // dropped on a toolbar = remove
  else { g.classList.remove("dragging"); g.__wrap.setAttribute("filter", "url(#pshadow)"); }
}
window.addEventListener("pointerup", endPieceDrag);
window.addEventListener("pointercancel", endPieceDrag);
document.getElementById("clearPiecesBtn").onclick = () => pieceLayer.replaceChildren();

// ---------- Canvas size and zoom (hex size) ----------
// The canvas is at least the board-plus-free-space world, and always fills the whole window,
// so the empty area to the right of the board is real, usable space.
const zoomVal = document.getElementById("zoomVal");
let zoom = 1;
function layoutCanvas() {
  const cw = stage.clientWidth, ch = stage.clientHeight;
  const W = Math.max(VB0.w * zoom, cw);
  const H = Math.max(VB0.h * zoom, ch - (VB0.w * zoom > cw ? 16 : 0)); // leave room for a horizontal scrollbar
  svg.style.width = W + "px";
  svg.style.height = H + "px";
  svg.setAttribute("viewBox", `${VB0.x} ${VB0.y} ${W / zoom} ${H / zoom}`);
}
function applyZoom(z) {
  const fx = (stage.scrollLeft + stage.clientWidth / 2) / Math.max(1, stage.scrollWidth);
  const fy = (stage.scrollTop + stage.clientHeight / 2) / Math.max(1, stage.scrollHeight);
  zoom = Math.max(0.3, Math.min(3, Math.round(z * 100) / 100));
  layoutCanvas();
  stage.scrollLeft = fx * stage.scrollWidth - stage.clientWidth / 2;
  stage.scrollTop = fy * stage.scrollHeight - stage.clientHeight / 2;
  zoomVal.textContent = Math.round(zoom * 100) + "%";
}
const fitZoom = () => Math.floor(Math.min(stage.clientWidth / BOARD_W, stage.clientHeight / VB0.h) * 100) / 100;
document.getElementById("zoomIn").onclick = () => applyZoom(zoom + 0.1);
document.getElementById("zoomOut").onclick = () => applyZoom(zoom - 0.1);
document.getElementById("zoomFit").onclick = () => { applyZoom(fitZoom()); stage.scrollLeft = 0; stage.scrollTop = 0; };
window.addEventListener("resize", layoutCanvas);

applyZoom(Math.min(1.5, Math.max(0.8, fitZoom()))); // opens with the whole board in view
stage.scrollLeft = 0;
stage.scrollTop = Math.max(0, (stage.scrollHeight - stage.clientHeight) / 2);

// ---------- Export / import ----------
// Saves everything: revealed/hidden tiles and their terrain (incl. overrides and home colours),
// dice, pieces, cards with their text, and the zoom level.
const PIECE_IDS = new Set(PIECE_GROUPS.flatMap(g => g.items.filter(i => i.id).map(i => i.id)));
const r2 = n => Math.round(n * 100) / 100;

function collectState() {
  return {
    app: "hex-playground", version: 1, savedAt: new Date().toISOString(),
    tiles: tiles.filter(t => t.zone === "outer" || t.zone === "corner").map(t => t.zone === "corner"
      ? { k: t.key, home: t.homeColor, origHome: t.origHome,
          ...(t.assigned ? { t: t.assigned.terrain, i: ICONS[t.assigned.terrain].indexOf(t.assigned.icon), cave: t.cave ? 1 : 0 } : {}) }
      : { k: t.key, t: t.assigned.terrain, i: ICONS[t.assigned.terrain].indexOf(t.assigned.icon),
          ot: t.original.terrain, oi: ICONS[t.original.terrain].indexOf(t.original.icon), rev: t.revealed, cave: t.cave ? 1 : 0 }),
    dice: { count: diceCount, list: dice.map(d => ({ t: d.type, v: d.value, free: d.free ? { x: r2(d.free.x), y: r2(d.free.y) } : null })) },
    pieces: [...pieceLayer.children].map(w => w.firstElementChild)
      .map(g => ({ type: g.__type, c: g.__ci, x: r2(g.__x), y: r2(g.__y) })),
    cards: [...cardLayer.children].map(g => ({ x: r2(g.__x), y: r2(g.__y), text: g.querySelector(".card-text").innerText.replace(/\n$/, "") })),
    zoom: zoom,
  };
}

function applyState(s) {
  if (!s || s.app !== "hex-playground" || !Array.isArray(s.tiles)) throw new Error("this is not a hex-playground save file");
  const byKey = new Map(tiles.map(t => [t.key, t]));
  const mk = (name, i) => {
    if (!TERRAINS[name]) throw new Error("unknown terrain \"" + name + "\"");
    return { terrain: name, icon: ICONS[name][i] || ICONS[name][0] };
  };
  // validate everything first so a bad file never leaves a half-loaded board
  const plan = [];
  s.tiles.forEach(e => {
    const t = byKey.get(e.k);
    if (!t) return;
    if (t.zone === "corner") {
      if (!PCOLORS[e.home] || !PCOLORS[e.origHome]) throw new Error("bad home colour");
      const over = e.t ? mk(e.t, e.i) : null; // terrain the home hex was overridden with, if any
      plan.push(() => { t.homeColor = e.home; t.origHome = e.origHome; t.assigned = over; t.cave = !!(over && e.cave); setFace(t); });
    } else if (t.zone === "outer") {
      const orig = mk(e.ot, e.oi);
      const cur = (e.t === e.ot && e.i === e.oi) ? orig : mk(e.t, e.i);
      plan.push(() => { t.original = orig; t.assigned = cur; t.revealed = !!e.rev; t.cave = !!e.cave; setFace(t); });
    }
  });
  const ok = (...n) => n.every(Number.isFinite);
  const dl = ((s.dice && s.dice.list) || []).map(d => {
    if (d.free && !ok(+d.free.x, +d.free.y)) throw new Error("bad die position");
    const ty = DIE_TYPES[d.t] ? d.t : "d6";
    return { id: nextDieId++, type: ty, value: Math.min(DIE_TYPES[ty].faces, Math.max(1, Math.round(d.v) || 1)), free: d.free ? { x: +d.free.x, y: +d.free.y } : null };
  });
  const pl = (s.pieces || []).filter(p => PIECE_IDS.has(p.type) && PCOLORS[p.c] && ok(+p.x, +p.y));
  const cl = (s.cards || []).filter(c => ok(+c.x, +c.y));

  plan.forEach(f => f());
  updateLegend();
  setCount((s.dice && s.dice.count) || diceCount);
  dice = dl; renderDice();
  pieceLayer.replaceChildren();
  pl.forEach(p => makePiece(p.type, p.c, +p.x, +p.y));
  cardLayer.replaceChildren();
  cl.forEach(c => { const g = makeCard(+c.x, +c.y); g.querySelector(".card-text").textContent = String(c.text || ""); });
  if (Number.isFinite(+s.zoom) && +s.zoom > 0) applyZoom(+s.zoom);
}

document.getElementById("exportBtn").onclick = () => {
  const d = new Date(), p2 = n => String(n).padStart(2, "0");
  const name = `hex-playground-${d.getFullYear()}-${p2(d.getMonth() + 1)}-${p2(d.getDate())}-${p2(d.getHours())}${p2(d.getMinutes())}.json`;
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([JSON.stringify(collectState(), null, 1)], { type: "application/json" }));
  a.download = name;
  document.body.append(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 2000);
};
const importFile = document.getElementById("importFile");
document.getElementById("importBtn").onclick = () => importFile.click();
importFile.onchange = async () => {
  const f = importFile.files[0];
  importFile.value = "";
  if (!f) return;
  try {
    const s = JSON.parse(await f.text());
    if (!confirm("Replace everything on the board with \"" + f.name + "\"?")) return;
    applyState(s);
  } catch (err) {
    alert("Could not import that file: " + err.message);
  }
};
</script>
</body>
</html>
