<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Hex Playground</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  body { margin: 0; font-family: system-ui, sans-serif; background: #2b2b2b; color: #eee; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
  #bar { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; padding: 8px 12px; background: #1d1d1d; }
  #diceBar, #piecesBar { display: flex; flex-wrap: wrap; gap: 6px 12px; align-items: center; padding: 6px 12px; background: #252525; border-top: 1px solid #333; }
  button { padding: 6px 12px; border: 0; border-radius: 4px; background: #555; color: #fff; cursor: pointer; }
  button:hover { background: #777; }
  button.active { background: #c0392b; }
  button.step { width: 28px; padding: 4px 0; }
  .chip { display: inline-flex; align-items: center; gap: 4px; padding: 2px 8px; border-radius: 4px; color: #111; font-weight: 600; }
  .chip img { height: 18px; width: 18px; }

  #zoomBox { display: inline-flex; align-items: center; gap: 6px; }
  #zoomVal { min-width: 44px; text-align: center; font-weight: 700; }

  #stage { flex: 1 1 0; min-height: 0; overflow: auto; background: #2b2b2b; }
  #board { display: block; }

  .tile { cursor: pointer; }
  .tile.home { cursor: default; }
  .tile .flip { transition: transform 0.15s ease-in; transform-box: fill-box; transform-origin: center; }
  .tile .flip.flipping { transform: scaleX(0); }
  .tile polygon { stroke: #222; stroke-width: 1.5; }
  .tile:not(.home):hover polygon { stroke: #fff; }
  .tile image { pointer-events: none; }

  #brushes { display: none; align-items: center; gap: 6px; padding: 3px 10px; border-radius: 16px; background: #333; }
  body.override #brushes { display: inline-flex; }
  #brushes small { color: #aaa; margin-right: 4px; }
  .brush { width: 30px; height: 30px; border-radius: 6px; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; box-sizing: border-box; border: 3px solid transparent; }
  .brush img { width: 22px; height: 22px; pointer-events: none; }
  .brush.sel { border-color: #fff; }
  .brush.restore { width: auto; padding: 0 8px; background: #555; color: #fff; font-size: 13px; }
  #board.override { touch-action: none; }
  #board.override .tile:not(.home) { cursor: crosshair; }

  #diceCount { min-width: 22px; text-align: center; font-weight: 700; }
  #diceTray { display: inline-flex; gap: 6px; align-items: center; min-height: 44px; padding: 0 8px; border-radius: 8px; background: #333; }
  #diceTray small { color: #aaa; }
  .die { display: inline-block; line-height: 0; cursor: grab; touch-action: none; }
  .die-on-board { cursor: grab; touch-action: none; }
  .ghost { position: fixed; z-index: 1000; width: 44px; height: 44px; pointer-events: none; line-height: 0; filter: drop-shadow(0 4px 4px rgba(0,0,0,.6)); }

  #colorDots { display: inline-flex; gap: 6px; align-items: center; }
  .cdot { width: 22px; height: 22px; border-radius: 50%; cursor: pointer; box-sizing: border-box; border: 3px solid #333; outline: 2px solid transparent; }
  .cdot.sel { outline-color: #fff; }
  #pieceTray { display: inline-flex; flex-wrap: wrap; gap: 4px; align-items: center; padding: 3px 6px; border-radius: 8px; background: #333; }
  .psw { display: inline-flex; width: 42px; height: 42px; align-items: center; justify-content: center; border-radius: 6px; cursor: grab; touch-action: none; }
  .psw:hover { background: #444; }
  .psw svg { pointer-events: none; }
  .piece { cursor: grab; touch-action: none; }
  .piece.dragging { cursor: grabbing; filter: drop-shadow(0 4px 4px rgba(0,0,0,.6)); }
</style>
</head>
<body>
<div id="bar">
  <button id="resetBtn">Hide all</button>
  <button id="revealBtn">Reveal all</button>
  <button id="newMapBtn">New map</button>
  <button id="overrideBtn">Override: off</button>
  <span id="brushes"><small>Paint grey tiles (click or drag):</small></span>
  <span id="zoomBox">Hex size
    <button class="step" id="zoomOut">−</button><span id="zoomVal"></span><button class="step" id="zoomIn">+</button>
    <button id="zoomFit">Fit</button>
  </span>
  <span id="legend"></span>
</div>
<div id="diceBar">
  <strong>Dice (d6)</strong>
  <span><button class="step" id="diceMinus">−</button> <span id="diceCount">3</span> <button class="step" id="dicePlus">+</button></span>
  <button id="rollBtn">Roll</button>
  <button id="clearDiceBtn">Clear dice</button>
  <span id="diceTray"></span>
</div>
<div id="piecesBar">
  <strong>Pieces</strong>
  <span id="colorDots" title="Player color"></span>
  <span id="pieceTray"></span>
  <button id="clearPiecesBtn">Clear pieces</button>
  <small style="color:#aaa">drag onto the board · right-click or double-click removes</small>
</div>
<div id="stage"><svg id="board"></svg></div>

const TERRAINS = {
  mountain:  { color: "#b6b6c0" },
  wood:      { color: "#62b062" },
  field:     { color: "#f0d868" },
  lake:      { color: "#72b6f0" },
  swamp:     { color: "#92aa78" },
  wasteland: { color: "#d2a37c" },
};

const ZONE_COLORS = { center: "#f09a00", outer: "#5c5c5c", special: "#8f0000", corner: "#8a00bd" };
const OUTER_PER_TERRAIN = 12; // each terrain appears exactly this many times on the grey tiles (6 x 12 = 72)
const SIZE = 40;              // hex radius in board units
const ICON_SIZE = 54;         // terrain icon size
const BORDER_WIDTH = 6;       // black outline around the orange region
const VB = { x: -540, y: -450, w: 1080, h: 900 }; // board + some background all around for parking pieces
const START_ZOOM = 1.4;       // on-screen pixels per board unit (hex size)
// ------------------------------------------

const NS = "http://www.w3.org/2000/svg";
const svg = document.getElementById("board");
const stage = document.getElementById("stage");
svg.setAttribute("viewBox", `${VB.x} ${VB.y} ${VB.w} ${VB.h}`);

function svgPoint(e) {
  const pt = svg.createSVGPoint();
  pt.x = e.clientX; pt.y = e.clientY;
  return pt.matrixTransform(svg.getScreenCTM().inverse());
}
const pick = arr => arr[Math.floor(Math.random() * arr.length)];
function shuffle(a) {
  for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
  return a;
}

// Board layout: rows r = -6..6, columns u in half-hex steps.
const range = (a, b, step) => { const o = []; for (let v = a; v <= b; v += step) o.push(v); return o; };
const ROWS = {
  [-6]: [-6, -4, -2, 2, 4, 6],
  [-5]: range(-7, 7, 2),
  [-4]: range(-8, 8, 2),
  [-3]: range(-7, 7, 2),
  [-2]: range(-10, 10, 2),
  [-1]: range(-11, 11, 2),
  [0]:  range(-12, 12, 2),
};
for (let r = 1; r <= 6; r++) ROWS[r] = ROWS[-r];

function zoneOf(r, u) {
  const R = Math.abs(r), U = Math.abs(u);
  if ((R === 6 && U === 6) || (R === 0 && U === 12)) return "corner";
  if ((R === 4 && U === 0) || (R === 2 && U === 6)) return "special";
  if (Math.max(R, (U + R) / 2) <= 3) return "center";
  return "outer";
}

const hw = Math.sqrt(3) * SIZE / 2;
const tiles = [];
let overrideMode = false, painting = false, brush = "lake";

function hexPoints() {
  const pts = [];
  for (let i = 0; i < 6; i++) {
    const a = Math.PI / 180 * (60 * i - 30); // pointy-top
    pts.push((SIZE * Math.cos(a)).toFixed(2) + "," + (SIZE * Math.sin(a)).toFixed(2));
  }
  return pts.join(" ");
}

function setFace(t) {
  if (t.zone === "corner") {
    t.poly.setAttribute("fill", ZONE_COLORS.corner);
    t.img.setAttribute("href", ICONS.home[0]);
    t.img.style.display = "";
  } else if (t.revealed) {
    t.poly.setAttribute("fill", TERRAINS[t.assigned.terrain].color);
    t.img.setAttribute("href", t.assigned.icon);
    t.img.style.display = "";
  } else {
    t.poly.setAttribute("fill", ZONE_COLORS[t.zone]);
    t.img.style.display = "none";
  }
}

function flipTo(t, revealed) {
  if (t.zone !== "outer") return; // only grey tiles flip; home, orange and red stay fixed for now
  t.revealed = revealed;
  t.flip.classList.add("flipping");
  setTimeout(() => { setFace(t); t.flip.classList.remove("flipping"); updateLegend(); }, 150);
}

for (const r of Object.keys(ROWS).map(Number)) {
  for (const u of ROWS[r]) {
    const zone = zoneOf(r, u);
    const g = document.createElementNS(NS, "g");
    g.setAttribute("class", "tile" + (zone !== "outer" ? " home" : ""));
    g.setAttribute("transform", `translate(${u * hw},${r * 1.5 * SIZE})`);
    const flip = document.createElementNS(NS, "g");
    flip.setAttribute("class", "flip");
    const poly = document.createElementNS(NS, "polygon");
    poly.setAttribute("points", hexPoints());
    const img = document.createElementNS(NS, "image");
    img.setAttribute("x", -ICON_SIZE / 2); img.setAttribute("y", -ICON_SIZE / 2);
    img.setAttribute("width", ICON_SIZE); img.setAttribute("height", ICON_SIZE);
    flip.append(poly, img);
    g.append(flip);
    svg.append(g);
    const t = { zone, assigned: null, revealed: false, poly, img, flip, cx: u * hw, cy: r * 1.5 * SIZE };
    setFace(t);
    g.__tile = t;
    g.addEventListener("click", () => { if (!overrideMode) flipTo(t, !t.revealed); });
    g.addEventListener("pointerdown", e => {
      if (!overrideMode || t.zone !== "outer" || e.button !== 0) return;
      e.preventDefault();
      painting = true;
      paint(t);
    });
    tiles.push(t);
  }
}

// Thick black outline around the whole orange (center) region: draw every edge
// of an orange tile whose neighbour is not orange.
(function drawCenterBorder() {
  const center = new Set();
  for (const r of Object.keys(ROWS).map(Number))
    for (const u of ROWS[r]) if (zoneOf(r, u) === "center") center.add(r + "," + u);
  const corner = i => {
    const a = Math.PI / 180 * (60 * i - 30);
    return [SIZE * Math.cos(a), SIZE * Math.sin(a)];
  };
  // neighbour offset (dr, du) -> the two hex corners forming the shared edge
  const EDGES = [[0, 2, 0, 1], [1, 1, 1, 2], [1, -1, 2, 3], [0, -2, 3, 4], [-1, -1, 4, 5], [-1, 1, 5, 0]];
  let d = "";
  center.forEach(key => {
    const [r, u] = key.split(",").map(Number);
    const cx = u * hw, cy = r * 1.5 * SIZE;
    EDGES.forEach(([dr, du, c1, c2]) => {
      if (center.has((r + dr) + "," + (u + du))) return;
      const [x1, y1] = corner(c1), [x2, y2] = corner(c2);
      d += `M${(cx + x1).toFixed(2)},${(cy + y1).toFixed(2)}L${(cx + x2).toFixed(2)},${(cy + y2).toFixed(2)}`;
    });
  });
  const path = document.createElementNS(NS, "path");
  path.setAttribute("d", d);
  path.setAttribute("fill", "none");
  path.setAttribute("stroke", "#000");
  path.setAttribute("stroke-width", BORDER_WIDTH);
  path.setAttribute("stroke-linecap", "round");
  path.setAttribute("stroke-linejoin", "round");
  path.style.pointerEvents = "none";
  svg.append(path);
})();

// Build a new hidden map: grey tiles get a shuffled fixed supply of each terrain.
function generateMap() {
  const names = Object.keys(TERRAINS);
  const outer = tiles.filter(t => t.zone === "outer");
  const deck = [];
  names.forEach(k => { for (let i = 0; i < OUTER_PER_TERRAIN; i++) deck.push(k); });
  while (deck.length < outer.length) deck.push(pick(names)); // only if the layout ever grows
  shuffle(deck);
  outer.forEach((t, i) => { t.assigned = t.original = { terrain: deck[i], icon: pick(ICONS[deck[i]]) }; });
  tiles.forEach(t => { if (t.zone === "outer" && t.revealed) flipTo(t, false); });
  updateLegend();
}

function updateLegend() {
  const counts = {}, outerCounts = {};
  Object.keys(TERRAINS).forEach(k => { counts[k] = 0; outerCounts[k] = 0; });
  tiles.forEach(t => {
    if (!t.revealed) return;
    counts[t.assigned.terrain]++;
    if (t.zone === "outer") outerCounts[t.assigned.terrain]++;
  });
  document.getElementById("legend").innerHTML = Object.keys(TERRAINS).map(k =>
    `<span class="chip" style="background:${TERRAINS[k].color}"><img src="${ICONS[k][0]}" alt="">${k}: ${counts[k]} <small style="${outerCounts[k] > OUTER_PER_TERRAIN ? 'color:#b00020;font-weight:800' : ''}">(grey ${outerCounts[k]}/${OUTER_PER_TERRAIN})</small></span>`
  ).join(" ");
}

const playable = () => tiles.filter(t => t.zone === "outer");
document.getElementById("resetBtn").onclick  = () => playable().forEach(t => t.revealed && flipTo(t, false));
document.getElementById("revealBtn").onclick = () => playable().forEach(t => !t.revealed && flipTo(t, true));
document.getElementById("newMapBtn").onclick = generateMap;
generateMap();

// ---------- Override (paint terrain onto grey tiles) ----------
function paint(t) {
  if (t.zone !== "outer") return;
  let next;
  if (brush === "restore") {
    if (t.assigned === t.original) return;
    next = t.original;
  } else {
    if (t.revealed && t.assigned.terrain === brush) return;
    next = (t.assigned && t.assigned.terrain === brush) ? t.assigned : { terrain: brush, icon: pick(ICONS[brush]) };
  }
  t.assigned = next;
  flipTo(t, true);
}

const brushBox = document.getElementById("brushes");
const brushEls = {};
Object.keys(TERRAINS).forEach(k => {
  const b = document.createElement("span");
  b.className = "brush"; b.title = k;
  b.style.background = TERRAINS[k].color;
  b.innerHTML = `<img src="${ICONS[k][0]}" alt="${k}">`;
  b.onclick = () => selectBrush(k);
  brushBox.append(b); brushEls[k] = b;
});
const restoreEl = document.createElement("span");
restoreEl.className = "brush restore"; restoreEl.textContent = "↺ Original";
restoreEl.title = "Put the originally generated terrain back";
restoreEl.onclick = () => selectBrush("restore");
brushBox.append(restoreEl); brushEls.restore = restoreEl;

function selectBrush(k) {
  brush = k;
  Object.entries(brushEls).forEach(([n, el]) => el.classList.toggle("sel", n === k));
}
selectBrush("lake");

document.getElementById("overrideBtn").onclick = function () {
  overrideMode = !overrideMode;
  this.textContent = "Override: " + (overrideMode ? "on" : "off");
  this.classList.toggle("active", overrideMode);
  document.body.classList.toggle("override", overrideMode);
  svg.classList.toggle("override", overrideMode);
};

window.addEventListener("pointermove", e => { // drag across tiles to paint several
  if (!painting) return;
  const el = document.elementFromPoint(e.clientX, e.clientY);
  const g = el && el.closest && el.closest(".tile");
  if (g && g.__tile) paint(g.__tile);
});
window.addEventListener("pointerup", () => { painting = false; });
window.addEventListener("pointercancel", () => { painting = false; });

// ---------- Dice ----------
// Dice live either in the tray or freely on the board/background, any number per hex.
const PIPS = {
  1: [[50, 50]],
  2: [[28, 28], [72, 72]],
  3: [[28, 28], [50, 50], [72, 72]],
  4: [[28, 28], [72, 28], [28, 72], [72, 72]],
  5: [[28, 28], [72, 28], [50, 50], [28, 72], [72, 72]],
  6: [[28, 25], [28, 50], [28, 75], [72, 25], [72, 50], [72, 75]],
};
const dieMarkup = v =>
  `<rect x="5" y="5" width="90" height="90" rx="16" fill="#fafafa" stroke="#111" stroke-width="6"/>` +
  PIPS[v].map(([x, y]) => `<circle cx="${x}" cy="${y}" r="9" fill="#111"/>`).join("");
const dieSvg = v => `<svg viewBox="0 0 100 100" width="44" height="44">${dieMarkup(v)}</svg>`;
const d6 = () => 1 + Math.floor(Math.random() * 6);

const FREE_DIE = 30; // die size on the board, in board units
let dice = [], nextDieId = 1, diceCount = 3, rolling = false, dieDrag = null;
const diceLayer = document.createElementNS(NS, "g");
svg.append(diceLayer);
const diceTray = document.getElementById("diceTray");

function renderDice() {
  diceTray.innerHTML = "";
  diceLayer.replaceChildren();
  let inTray = 0;
  dice.forEach(d => {
    if (d.dragging) return;
    if (!d.free) {
      inTray++;
      const el = document.createElement("span");
      el.className = "die";
      el.innerHTML = dieSvg(d.value);
      el.addEventListener("pointerdown", e => beginDieDrag(d, e));
      el.addEventListener("contextmenu", e => { e.preventDefault(); removeDie(d); });
      diceTray.append(el);
    } else {
      const g = document.createElementNS(NS, "g");
      g.setAttribute("class", "die-on-board");
      g.setAttribute("transform", `translate(${d.free.x - FREE_DIE / 2},${d.free.y - FREE_DIE / 2}) scale(${FREE_DIE / 100})`);
      g.innerHTML = dieMarkup(d.value);
      g.addEventListener("pointerdown", e => beginDieDrag(d, e));
      g.addEventListener("contextmenu", e => { e.preventDefault(); removeDie(d); });
      diceLayer.append(g);
    }
  });
  if (!inTray) diceTray.innerHTML = `<small>${dice.length ? "all dice placed" : "press Roll"}</small>`;
}

function removeDie(d) { dice = dice.filter(x => x !== d); renderDice(); }

function rollDice() {
  if (rolling) return;
  // a roll replaces the current set of dice (placed ones too)
  dice = Array.from({ length: diceCount }, () => ({ id: nextDieId++, value: d6(), free: null }));
  rolling = true;
  renderDice();
  let ticks = 0;
  const iv = setInterval(() => { // quick shuffle animation, result is already decided
    diceTray.querySelectorAll(".die svg").forEach(sv => { sv.innerHTML = dieMarkup(d6()); });
    if (++ticks >= 8) { clearInterval(iv); rolling = false; renderDice(); }
  }, 70);
}

function beginDieDrag(d, e) {
  if (rolling || e.button !== 0) return;
  e.preventDefault();
  const ghost = document.createElement("div");
  ghost.className = "ghost";
  ghost.innerHTML = dieSvg(d.value);
  document.body.append(ghost);
  d.dragging = true;
  dieDrag = { d, origin: d.free, ghost };
  moveGhost(e);
  renderDice();
}
function moveGhost(e) {
  dieDrag.ghost.style.left = (e.clientX - 22) + "px";
  dieDrag.ghost.style.top = (e.clientY - 22) + "px";
}
window.addEventListener("pointermove", e => { if (dieDrag) moveGhost(e); });

function endDieDrag(e) {
  if (!dieDrag) return;
  const { d, origin, ghost } = dieDrag;
  ghost.remove();
  dieDrag = null;
  d.dragging = false;
  const over = document.elementFromPoint(e.clientX, e.clientY);
  const r = stage.getBoundingClientRect();
  const inStage = e.clientX >= r.left && e.clientX <= r.right && e.clientY >= r.top && e.clientY <= r.bottom;
  d.free = null;
  if (over && over.closest("#diceBar")) {
    // dropped on the dice bar = back to the tray
  } else if (!inStage) {
    d.free = origin; // dropped on another toolbar or off the page: back where it was
  } else {
    const p = svgPoint(e);
    d.free = { x: p.x, y: p.y }; // stays exactly where it was dropped
    dice = dice.filter(x => x !== d).concat(d); // bring to front
  }
  renderDice();
}
window.addEventListener("pointerup", endDieDrag);
window.addEventListener("pointercancel", endDieDrag);

const setCount = n => { diceCount = Math.max(1, Math.min(12, n)); document.getElementById("diceCount").textContent = diceCount; };
document.getElementById("diceMinus").onclick = () => setCount(diceCount - 1);
document.getElementById("dicePlus").onclick = () => setCount(diceCount + 1);
document.getElementById("rollBtn").onclick = rollDice;
document.getElementById("clearDiceBtn").onclick = () => { if (!rolling) { dice = []; renderDice(); } };
renderDice();

// ---------- Pieces: shapes, workers, buildings ----------
const PCOLORS = [ // fill, outline, which icon colour reads best on it
  { fill: "#e53935", line: "#fff", icon: "dark" },
  { fill: "#1e88e5", line: "#fff", icon: "dark" },
  { fill: "#43a047", line: "#fff", icon: "dark" },
  { fill: "#fdd835", line: "#111", icon: "dark" },
  { fill: "#f5f5f5", line: "#111", icon: "dark" },
  { fill: "#212121", line: "#fff", icon: "light" },
];
const PIECE_TYPES = [
  { id: "circle",   label: "Circle" },
  { id: "square",   label: "Square" },
  { id: "triangle", label: "Triangle" },
  { id: "octagon",  label: "Octagon" },
  { id: "worker",   label: "Worker" },
  { id: "windmill", label: "Windmill" },
  { id: "mine",     label: "Mine" },
  { id: "sawmill",  label: "Sawmill" },
  { id: "village",  label: "Village" },
  { id: "tower",    label: "Tower" },
  { id: "rig",      label: "Oil rig" },
];
const OCT = Array.from({ length: 8 }, (_, i) => {
  const a = Math.PI / 180 * (45 * i + 22.5);
  return (12.5 * Math.cos(a)).toFixed(1) + "," + (12.5 * Math.sin(a)).toFixed(1);
}).join(" ");

const pieceIcon = (type, c, size) =>
  `<image href="${PIECE_ICONS[type][c.icon]}" x="${-size / 2}" y="${-size / 2}" width="${size}" height="${size}" style="pointer-events:none"/>`;

function pieceMarkup(type, c) { // centred on (0,0); all pieces are about 22-32 board units wide
  const st = `fill="${c.fill}" stroke="${c.line}" stroke-width="2.5" stroke-linejoin="round"`;
  switch (type) {
    case "circle":   return `<circle r="11" ${st}/>`;
    case "square":   return `<rect x="-10" y="-10" width="20" height="20" rx="2" ${st}/>`;
    case "triangle": return `<polygon points="0,-13 12,9 -12,9" ${st}/>`;
    case "octagon":  return `<polygon points="${OCT}" ${st}/>`;
    case "worker":   return `<circle r="14" ${st}/>` + pieceIcon(type, c, 24);
    default:         return `<rect x="-16" y="-16" width="32" height="32" rx="6" ${st}/>` + pieceIcon(type, c, 26);
  }
}

const pieceLayer = document.createElementNS(NS, "g");
svg.append(pieceLayer); // above the dice
let pieceColor = 0, pieceDrag = null;

function placePiece(g, x, y) {
  g.__x = x; g.__y = y;
  g.setAttribute("transform", `translate(${x},${y})`);
}
function makePiece(type, ci, x, y) {
  const g = document.createElementNS(NS, "g");
  g.setAttribute("class", "piece");
  g.innerHTML = pieceMarkup(type, PCOLORS[ci]);
  placePiece(g, x, y);
  pieceLayer.append(g);
  g.addEventListener("pointerdown", e => {
    if (e.button !== 0) return; // right click is handled by contextmenu below
    e.preventDefault();
    const p = svgPoint(e);
    startPieceDrag(g, p.x - g.__x, p.y - g.__y);
  });
  g.addEventListener("contextmenu", e => { e.preventDefault(); g.remove(); }); // right click = remove
  g.addEventListener("dblclick", () => g.remove());
  return g;
}
function startPieceDrag(g, dx, dy) {
  pieceDrag = { g, dx, dy };
  g.classList.add("dragging");
  pieceLayer.append(g); // bring to front
}

function renderPieceTray() {
  const tray = document.getElementById("pieceTray");
  tray.innerHTML = "";
  PIECE_TYPES.forEach(pt => {
    const sw = document.createElement("span");
    sw.className = "psw"; sw.title = pt.label;
    sw.innerHTML = `<svg viewBox="-20 -20 40 40" width="38" height="38">${pieceMarkup(pt.id, PCOLORS[pieceColor])}</svg>`;
    sw.addEventListener("pointerdown", e => {
      if (e.button !== 0) return;
      e.preventDefault();
      const p = svgPoint(e);
      startPieceDrag(makePiece(pt.id, pieceColor, p.x, p.y), 0, 0);
    });
    tray.append(sw);
  });
}
const dots = document.getElementById("colorDots");
PCOLORS.forEach((c, i) => {
  const d = document.createElement("span");
  d.className = "cdot" + (i === pieceColor ? " sel" : "");
  d.style.background = c.fill;
  d.title = "Color " + (i + 1);
  d.onclick = () => {
    pieceColor = i;
    [...dots.children].forEach((el, j) => el.classList.toggle("sel", j === i));
    renderPieceTray();
  };
  dots.append(d);
});
renderPieceTray();

window.addEventListener("pointermove", e => {
  if (!pieceDrag) return;
  const p = svgPoint(e);
  placePiece(pieceDrag.g, p.x - pieceDrag.dx, p.y - pieceDrag.dy);
});
function endPieceDrag(e) {
  if (!pieceDrag) return;
  const { g } = pieceDrag;
  pieceDrag = null;
  const over = document.elementFromPoint(e.clientX, e.clientY);
  if (over && over.closest("#bar, #diceBar, #piecesBar")) g.remove(); // dropped on a toolbar = remove
  else g.classList.remove("dragging");
}
window.addEventListener("pointerup", endPieceDrag);
window.addEventListener("pointercancel", endPieceDrag);
document.getElementById("clearPiecesBtn").onclick = () => pieceLayer.replaceChildren();

// ---------- Zoom (hex size) ----------
const zoomVal = document.getElementById("zoomVal");
let zoom = START_ZOOM;
function applyZoom(z) {
  const fx = (stage.scrollLeft + stage.clientWidth / 2) / (VB.w * zoom);
  const fy = (stage.scrollTop + stage.clientHeight / 2) / (VB.h * zoom);
  zoom = Math.max(0.3, Math.min(3, Math.round(z * 100) / 100));
  svg.style.width = (VB.w * zoom) + "px";
  svg.style.height = (VB.h * zoom) + "px";
  stage.scrollLeft = fx * VB.w * zoom - stage.clientWidth / 2;
  stage.scrollTop = fy * VB.h * zoom - stage.clientHeight / 2;
  zoomVal.textContent = Math.round(zoom * 100) + "%";
}
document.getElementById("zoomIn").onclick = () => applyZoom(zoom + 0.1);
document.getElementById("zoomOut").onclick = () => applyZoom(zoom - 0.1);
document.getElementById("zoomFit").onclick = () =>
  applyZoom(Math.floor(Math.min(stage.clientWidth / VB.w, stage.clientHeight / VB.h) * 100) / 100);
applyZoom(START_ZOOM);
stage.scrollLeft = (VB.w * zoom - stage.clientWidth) / 2; // start with the board centred
stage.scrollTop = (VB.h * zoom - stage.clientHeight) / 2;
</script>
</body>
</html>
